@PART[EDB-TPAAHab1Lunar]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	

	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/FutureTech/TPAAHab1Lunar
		scale = 1,1,1
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		volume = 3000
		type = ServiceModule
		
		TANK
		{
			name = ElectricCharge
			amount = 36000.0
			maxAmount = 36000.0
		}
		TANK
		{
			name = Food
			amount = 330.0
			maxAmount = 330.0
		}
		TANK
		{
			name = Water
			amount = 220.0
			maxAmount = 220.0
		}
		TANK
		{
			name = Oxygen
			amount = 33332.0
			maxAmount = 33332.0
		}
		TANK
		{
			name = CarbonDioxide
			amount = 0
			maxAmount = 28780.0
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 30.0
		}
		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 116.2
		}
		
		
	}
	
	
}

