@REFLECTION_CONFIG[default]:NEEDS[TexturesUnlimited]
{
	%enabled = true
}

KSP_MODEL_SHADER
{
	name = EDB-GrandRadiator
	model = EDBMods/Parts/FutureTech/GrandRadiator
	TEXTURE
    {
        shader = TU/Metallic
		
        PROPERTY
		{
			name = _Color
			color = 1.0,1.0,1.0 //higher numbers are lighter
		}
		PROPERTY
		{
			name = _Metal
			float = 0.5 // 0>less metallic 1>more metallic(mirror finish)
		}
		PROPERTY
			{
			name = _Smoothness
			float = 0.5   // 1>less blurry 0>more blurry
		}
	}
}

KSP_MODEL_SHADER
{
	name = EDB-GrandRadiatorShadowShield
	model = EDBMods/Parts/FutureTech/GrandRadiatorShadowShield
	TEXTURE
    {
        shader = TU/Metallic
		
        PROPERTY
		{
			name = _Color
			color = 1.0,1.0,1.0 //higher numbers are lighter
		}
		PROPERTY
		{
			name = _Metal
			float = 0.7 // 0>less metallic 1>more metallic(mirror finish)
		}
		PROPERTY
			{
			name = _Smoothness
			float = 0.6   // 1>less blurry 0>more blurry
		}
	}
}