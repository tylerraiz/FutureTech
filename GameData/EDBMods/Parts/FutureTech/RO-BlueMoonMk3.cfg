@PART[EDB-BlueMoonMk3]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/FutureTech/BlueMoonMk3
		scale = 1.0,1.0,1.0
	}
	
	@scale = 1.0
	
	@mass = 6.2
	
	
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}
	!MODULE[ModuleRCSFX]{}
	!MODULE[ModuleResourceConverter]{}
	!RESOURCE[MonoPropellant]{}
	!RESOURCE[ElectricCharge]{}
	
	
	RESOURCE
	{
		name = ElectricCharge
		amount = 24000
		maxAmount = 24000
	}
	
	MODULE
	{
		name = ModuleFuelTanks
		volume = 135200
		type = Cryogenic
		basemass = -1
		
		TANK
		{
			name = LqdHydrogen
			amount = 103171.1
			maxAmount = 103171.1
		}
		TANK
		{
			name = LqdOxygen
			amount = 32028.9
			maxAmount = 32028.9
		}
	}
	
	
	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 0.40

		PROPELLANT
		{
			name = LqdHydrogen
			ratio = 0.7631
			DrawGauge = True
		}
		PROPELLANT
		{
			name = LqdOxygen
			ratio = 0.2369
		}
		atmosphereCurve
		{
			key = 0 400.0
			key = 1 1.0
		}
	}
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 16.0
		@maxThrust = 160.0
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = LqdHydrogen
			@ratio = 0.7631
			@DrawGauge = True
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.2369
		
		}
		@atmosphereCurve
		{
			@key,0 = 0 452.8
			@key,1 = 1 100
		}
		%ullage = False
		%pressureFed = False
		%ignitions = 40
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = BE-7x4
		CONFIG
		{
			name = BE-7x4
			minThrust = 16.0
			maxThrust = 160.0
			heatProduction = 160
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.7631
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2369
			}
			atmosphereCurve
			{
				key = 0 452.8
				key = 1 100
			}
		}
	}
	
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Fuel Cell
		StartActionName = Start Fuel Cell
		StopActionName = Stop Fuel Cell
		ToggleActionName = Toggle Fuel Cell
		FillAmount = 1
		AutoShutdown = False
		GeneratesHeat = True
		UseSpecialistBonus = False
		
		INPUT_RESOURCE
		{
			ResourceName = LqdHydrogen
			Ratio = 0.001719
		}

		INPUT_RESOURCE
		{
			ResourceName = LqdOxygen
			Ratio = 0.000855
		}

		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 7
			DumpExcess = False
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Water
			Ratio = 0.00116666666666
			DumpExcess = True
		}
	}
	
}