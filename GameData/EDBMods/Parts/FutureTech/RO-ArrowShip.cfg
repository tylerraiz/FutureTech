@PART[EDB-ArrowShip-ArrowRadiators]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/FutureTech/ArrowShip-ArrowRadiators
		scale = 1.0,1.0,1.0
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
}

@PART[EDB-ArrowShip-ArrowRadiators]:FOR[SystemHeat]
{
  MODULE
  {
    name = ModuleSystemHeat
    volume = 9.94
    moduleID = default
    iconName = Icon_Radiator
    ignoreTemperature = true
  }

  @MODULE[ModuleActiveRadiator]
  {
    @name = ModuleSystemHeatRadiator
    moduleID = radiator
    // ModuleSystemHeat instance to link to
    systemHeatModuleID = default
    scalarModuleID = heat
    maxTempAnimation = 1000

    // option: use deterministic temperatures
    // Power radiated per temperature
    temperatureCurve
    {
      key = 0 0
      key = 750 100000
    }
    // area for convection
    convectiveArea = 2000.0
  }
}

