	{
		model = EDBMods/Parts/FutureTech/ArrowShip-RCSandShield
		scale = 1.0,1.0,1.0
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		volume = 29050
		type = ServiceModule
		maxMLILayers = 100

		TANK
		{
			name = ElectricCharge
			amount = 50000.0
			maxAmount = 50000.0
		}
		TANK
		{
			name = LqdHydrogen
			amount = 21141.0
			maxAmount = 21141.0
		}
		TANK
		{
			name = LqdOxygen
			amount = 7859.0
			maxAmount = 7859.0
		}
	}
	
	!MODULE[ModuleRCS*],* {}

	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 8.0

		PROPELLANT
		{
			name = LqdHydrogen
			ratio = 0.729
			DrawGauge = True
		}
		
		PROPELLANT
		{
			name = LqdOxygen
			ratio = 0.271
			DrawGauge = True
		}

		atmosphereCurve
		{
			key = 0 420.0
			key = 1 180.0
		}
	}
	
}