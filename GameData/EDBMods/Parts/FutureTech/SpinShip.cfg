PART
{
	name = EDB-SpinShip
	module = Part
	author = tylerraiz
	MODEL
	{
		model = EDBMods/Parts/FutureTech/SpinShip
		scale = 0.64, 0.64, 0.64
	}
	scale = 0.64
	rescaleFactor = 1.0
	node_stack_top = 0.0, 19.0, 0.0, 0.0, 1.0, 0.0, 2
	node_stack_bottom = 0.0, -3.0, 0.0, 0.0, -1.0, 0.0, 2
	
	TechRequired = basicRocketry
	entryCost = 3500
	cost = 1200
	category = Pods
	subcategory = 0
	title = Spin Ship
	manufacturer = Surestrut Industries
	description = Ship designed for launch on SLS
	attachRules = 1,1,1,1,1
	mass = 108.0
	heatConductivity = 0.06 // half default
	skinInternalConductionMult = 4.0
	emissiveConstant = 0.8 // engine nozzles are good at radiating.
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 7
	vesselType = Ship
	maxTemp = 2000 // = 3600
	bulkheadProfiles = size1
	tags = launch propuls rocket sustain service module
	CrewCapacity = 8
	
	MODULE
	{
		name = ModuleCommand
		minimumCrew = 0
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.4
		}
		hasHibernation = True
	}

	MODULE
	{
		name = ModuleSAS
		SASServiceLevel = 2
	}
	MODULE
	{
		name = ModuleKerbNetAccess
		MinimumFoV = 17
		MaximumFoV = 63
		AnomalyDetection = 0.12
		DISPLAY_MODES
		{
			Mode = Terrain,#autoLOC_438839 //#autoLOC_438839 = Terrain
		}
	}
	MODULE
	{
		name = ModuleDataTransmitter
		antennaType = DIRECT
		packetInterval = 0.10
		packetSize = 2
		packetResourceCost = 20.0
		requiredResource = ElectricCharge
		DeployFxModules = 0
		antennaPower = 100000000000
		antennaCombinable = True
	}
	
	MODULE
	{
		name = ModuleAnimateGeneric
		animationName = Deploy
		startEventGUIName = Extend
		endEventGUIName = Retract
		actionGUIName = Toggle
		allowDeployLimit = true
		revClampDirection = false
		revClampSpeed = true
		revClampPercent = true			
	}
	
	EFFECTS
	{
		running
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_mini
				volume = 0.0 0.0
				volume = 0.1 0.0
				volume = 0.5 0.025
				volume = 1.0 0.1
				pitch = 0.0 0.75
				pitch = 1.0 1.5
				loop = true
			}
			MODEL_MULTI_PARTICLE
			{
				modelName = Squad/FX/Monoprop_small
				transformName = RCSthruster
				emission = 0.0 0.0
				emission = 0.1 0.0
				emission = 1.0 1.0
				speed = 0.0 0.8
				speed = 1.0 1.0
				localRotation = -90, 0, 0
			}
		}		
	}


	RESOURCE
	{
		name = ElectricCharge
		amount = 4000
		maxAmount = 4000
	}

	RESOURCE
	{
		name = MonoPropellant
		amount = 160
		maxAmount = 160
	}
	
	MODULE
	{
		name = ModuleRCSFX
		stagingEnabled = False
		thrusterTransformName = RCSthruster
		thrusterPower = 1.0
		resourceName = MonoPropellant
		resourceFlowMode = STAGE_PRIORITY_FLOW
		runningEffectName = running
		atmosphereCurve
		{
			key = 0 240
			key = 1 100
			key = 4 0.001
		}
	}


}
