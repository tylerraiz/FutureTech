@PART[EDB-GrandRadiator]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/FutureTech/GrandRadiator
		scale = 1.0,1.0,1.0
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	%radiatorHeadroom = 0.29 // 0.2702 sets the limit to 17C, or 290K
	
	@MODULE[ModuleActiveRadiator]
    {
        //@maxEnergyTransfer = 1000000
        //@overcoolFactor = 0.0186367

        @RESOURCE[ElectricCharge]
        {
            @rate = 0.2
        }
    }
	
	//MODULE
	//{
	//	name = FlatFNRadiator
	//	isDeployable = false
	//	partMass = 65.3
	//	radiatorArea = 2000
	//	upgradeCost = 5
	//	surfaceAreaUpgradeTechReq = metaMaterials
	//}
	
	RESOURCE
	{
		name = WasteHeat
		amount = 0
		maxAmount = 2000
	}
	
}

