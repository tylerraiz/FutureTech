@PART[EDB-LiquidDropletRadiator]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/FutureTech/LiquidDropletRadiator
		scale = 1.0,1.0,1.0
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
}

@PART[EDB-LiquidDropletRadiator]:FOR[SystemHeat]
{
  MODULE
  {
    name = ModuleSystemHeat
    volume = 0.4
    moduleID = default
    iconName = Icon_Radiator
    ignoreTemperature = true
  }

  @MODULE[ModuleActiveRadiator]
  {
    @name = ModuleSystemHeatRadiator
    moduleID = radiator
    // ModuleSystemHeat instance to link to
    systemHeatModuleID = default
    scalarModuleID = heat
    maxTempAnimation = 1000

    // option: use deterministic temperatures
    // Power radiated per temperature
    temperatureCurve
    {
      key = 0 0
      key = 1100 2400
    }
    // area for convection
    convectiveArea = 20.0
   }
}

@PART[EDB-LiquidDropletRadiator]:FOR[SystemHeat]
{
	%MODULE[TweakScale]
    {
        type = surface
		defaultScale = 1.25
    }	
}

