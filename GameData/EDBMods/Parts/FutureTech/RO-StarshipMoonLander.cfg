+PART[EDB-StarshipMoonLanderBody]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	@name = EDB-StarshipMoonLanderBody2
	
	@title = Starship Lunar Lander - Upper Tank version
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/FutureTech/StarshipMoonLanderBody
		scale = 1,1,1
	}
	@scale = 1.0
	
	@mass = 47.0
	
	%CoMOffset = 0.0, -5.0, 0.0
	
	!RESOURCE[ElectricCharge]{}
	!RESOURCE[MonoPropellant]{}
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}
	
	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		volume = 520000
		type = ServiceModule
		
		TANK
		{
			name = ElectricCharge
			amount = 360000.0
			maxAmount = 360000.0
		}
		TANK
		{
			name = Food
			amount = 3300.0
			maxAmount = 3300.0
		}
		TANK
		{
			name = Water
			amount = 2200.0
			maxAmount = 2200.0
		}
		TANK
		{
			name = Oxygen
			amount = 333320.0
			maxAmount = 333320.0
		}
		TANK
		{
			name = CarbonDioxide
			amount = 0
			maxAmount = 287800.0
		}
		TANK
		{
			name = Nitrogen
			amount = 2700.0
			maxAmount = 2700.0
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 300.0
		}
		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 1162.0
		}
		TANK
		{
			name = LqdMethane
			amount = 187387.4
			maxAmount = 187387.4
		}
		TANK
		{
			name = LqdOxygen
			amount = 265567.4
			maxAmount = 265567.4
		}
	}
	
	
	!MODULE[ModuleRCSFX]{}
	
	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 4.8

		PROPELLANT
		{
			name = LqdMethane
			ratio = 0.4137
			DrawGauge = True
		}
		PROPELLANT
		{
			name = LqdOxygen
			ratio = 0.5863
		}
		atmosphereCurve
		{
			key = 0 330
			key = 1 240
		}
	}
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 432.0
		@maxThrust = 1296.0
		@heatProduction = 160
		@PROPELLANT[LiquidFuel]
		{
			@name = LqdMethane
			@ratio = 0.4137
			@DrawGauge = True
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.5863
		
		}
		@atmosphereCurve
		{
			@key,0 = 0 340
			@key,1 = 1 200
		}
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = StarshipLunar
		CONFIG
		{
			name = StarshipLunar
			minThrust = 432.0
			maxThrust = 1296.0
			heatProduction = 160
			PROPELLANT
			{
				name = LqdMethane
				ratio = 0.4137
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.5863
			}
			atmosphereCurve
			{
				key = 0 340
				key = 1 200
			}
		}
	}
	
	!MODULE[ModuleResourceConverter]{}
	
	MODULE
	{
		 name = ModuleResourceConverter
		 ConverterName = #autoLOC_502022 //#autoLOC_502022 = Fuel Cell
		 StartActionName = #autoLOC_502023 //#autoLOC_502023 = Start Fuel Cell
		 StopActionName = #autoLOC_502024 //#autoLOC_502024 = Stop Fuel Cell
		 ToggleActionName = #autoLOC_502025 //#autoLOC_502025 = Toggle Fuel Cell
		 FillAmount = 0.95
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false
 
		 
		 INPUT_RESOURCE
		 {
			ResourceName = LqdMethane
			Ratio = 0.00155
			FlowMode = STAGE_PRIORITY_FLOW
		 }
		 INPUT_RESOURCE
		 {
			ResourceName = LqdOxygen
			Ratio = 0.00220
			FlowMode = STAGE_PRIORITY_FLOW
		 }
		 OUTPUT_RESOURCE
		 {
			ResourceName = ElectricCharge
			Ratio = 12.0
			DumpExcess = false
		 }
	}
	
}
